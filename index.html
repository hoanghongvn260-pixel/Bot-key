<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiuMod</title>
    <script src="https://telegram.org"></script>
    <style>
        body { background-color: #0b141a; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .avatar-container { margin-top: 20px; position: relative; }
        .avatar { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #0088cc; box-shadow: 0 0 15px rgba(0, 136, 204, 0.5); object-fit: cover; }
        h1 { font-size: 24px; font-weight: bold; margin: 20px 0 5px 0; letter-spacing: 1px; }
        .subtitle { color: #8899a6; font-size: 14px; margin-bottom: 30px; }
        .card { background-color: #15222b; border-radius: 12px; width: 90%; max-width: 360px; padding: 15px 0; margin-bottom: 15px; border: 1px solid #20313c; }
        .card-title { font-size: 22px; font-weight: bold; }
        .card-desc { font-size: 11px; color: #718096; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .text-green { color: #2ecc71; }
        .btn { width: 90%; max-width: 360px; padding: 14px 0; border-radius: 12px; margin-bottom: 12px; font-size: 15px; font-weight: bold; text-decoration: none; display: inline-block; box-sizing: border-box; cursor: pointer; text-transform: uppercase; }
        .btn-getkey { background-color: transparent; color: #2ecc71; border: 1px solid #2ecc71; }
        .btn-secondary { background-color: #1c2d37; color: #ffffff; border: 1px solid #283d4b; }
        .footer { margin-top: 40px; font-size: 12px; color: #4a5568; }
    </style>
</head>
<body>

    <!-- Ảnh Đại Diện Tròn Logo Xanh -->
    <div class="avatar-container">
        <img class="avatar" src="https://imgur.com" alt="Logo MiuMod">
    </div>

    <h1>GET KEY MIUMOD</h1>
    <div class="subtitle">Lấy key miễn phí qua Telegram Bot.</div>

    <div class="card">
        <div class="card-title text-green" id="key-count">422</div>
        <div class="card-desc">Keys Còn Lại</div>
    </div>

    <div class="card">
        <div class="card-title text-green">FREE</div>
        <div class="card-desc">Hoàn Toàn Miễn Phí</div>
    </div>

    <!-- Nút lấy key trực tiếp chuyển hướng đến Link4m kiếm tiền của bạn -->
    <div class="btn btn-getkey" onclick="handleGetKey()">🔑 Lấy Key Miễn Phí</div>
    <a href="https://t.me" target="_blank" class="btn btn-secondary">👤 Liên Hệ Admin</a>
    <a href="https://t.me" target="_blank" class="btn btn-secondary">👥 Tham Gia Nhóm</a>

    <div class="footer">Hệ thống key tự động · Miễn phí 100%</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // API Key Link4m của bạn
        const LINK4M_API = "68b2988438d8cc2a1f108c6d";
        
        // Link bot của bạn để người dùng sau khi vượt link sẽ tự quay lại bot nhận key
        const BOT_URL = "https://t.me"; 

        function handleGetKey() {
            // Tự động tạo link rút gọn kiếm tiền bằng tài khoản Link4m của bạn
            const shortUrl = `https://link4m.com{LINK4M_API}&url=${encodeURIComponent(BOT_URL)}`;
            
            // Mở link vượt mã kiếm tiền toàn màn hình trên Telegram
            tg.openLink(shortUrl);
        }
    </script>
</body>
</html>
